<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: nötig damit die App das ganze Display nutzt
        (inkl. Bereich um den Notch). Ohne das bleibt iOS schwarz.
      user-scalable=no, maximum-scale=1: verhindert ungewolltes Zoomen
        per Doppeltipp – fühlt sich in einem Spiel native an.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- iOS-spezifische Web-App-Tags. Wirken sowohl in Capacitor als
         auch wenn man die Web-Version per "Zum Home-Bildschirm"
         als PWA installiert. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Word Blitz" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Primary SEO -->
    <title>Word Blitz – fast word-association game</title>
    <meta
      name="description"
      content="Word Blitz is a fast, playful word-association game. Draw a random letter and a prompt, then find a matching word before the timer runs out."
    />
    <meta name="theme-color" content="#6366f1" />
    <link rel="canonical" href="https://your-domain.example/" />

    <!-- Open Graph (for social previews; not part of Lighthouse SEO but
         good practice whenever you add meta tags) -->
    <meta property="og:title" content="Word Blitz" />
    <meta
      property="og:description"
      content="A fast, playful word-association game."
    />
    <meta property="og:type" content="website" />
    <!-- <meta property="og:url" content="https://wordblitz.com/" /> -->
    <!-- <meta
      property="og:image"
      content="https://wordblitz.com/og-image.png"
    /> -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
